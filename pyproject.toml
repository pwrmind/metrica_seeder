[project]
name = "metrica-seeder"
version = "0.1.0"
description = "Seeds Yandex Metrica with offline conversion journeys for real clients"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
mseeder = "metrica_seeder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrica_seeder"]

[tool.ruff]
line-length = 100
target-version = "py310"